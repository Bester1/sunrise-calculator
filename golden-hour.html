function julianN(date) {
  return date.getTime() / 86400000 + 2440587.5 - 2451545.0;
}

function solarPoint(date) {
  const n = julianN(date);
  let L = (280.460 + 0.9856474 * n) % 360;
  if (L < 0) L += 360;
  let g = (357.528 + 0.9856003 * n) % 360;
  if (g < 0) g += 360;
  const lambda = L + 1.915 * Math.sin(g * RAD) + 0.020 * Math.sin(2 * g * RAD);
  const eps = 23.439 - 0.0000004 * n;
  const lam = lambda * RAD;
  const ob = eps * RAD;
  const ra = Math.atan2(Math.cos(ob) * Math.sin(lam), Math.cos(lam));
  const dec = Math.asin(Math.sin(ob) * Math.sin(lam));
  let gmst = (280.46061837 + 360.98564736629 * n) % 360;
  if (gmst < 0) gmst += 360;
  let subLon = (ra * DEG - gmst) % 360;
  if (subLon > 180) subLon -= 360;
  if (subLon < -180) subLon += 360;
  return { dec: dec * DEG, subLon: subLon, lambda: ((lambda % 360) + 360) % 360, gmst: gmst };
}

function moonPoint(date, sun) {
  const syn = 29.530588853;
  const known = Date.UTC(2000, 0, 6, 18, 14, 0);
  const days = (date.getTime() - known) / 86400000;
  const age = ((days % syn) + syn) % syn;
  const elong = (age / syn) * 360;
  const lambda = sun.lambda + elong;
  const beta = 5.14 * Math.sin(elong * RAD);
  const eps = (23.439) * RAD;
  const lam = lambda * RAD;
  const bet = beta * RAD;
  const ra = Math.atan2(Math.sin(lam) * Math.cos(eps) - Math.tan(bet) * Math.sin(eps), Math.cos(lam));
  const dec = Math.asin(Math.sin(bet) * Math.cos(eps) + Math.cos(bet) * Math.sin(eps) * Math.sin(lam));
  let lon = (ra * DEG - sun.gmst) % 360;
  if (lon > 180) lon -= 360;
  if (lon < -180) lon += 360;
  return { lat: dec * DEG, lon: lon, age: age };
}

function geoVec(lat, lon, radius) {
  const phi = (90 - lat) * RAD;
  const theta = (lon + 180) * RAD;
  const sinPhi = Math.sin(phi);

    radius * Math.cos(phi),

    controls.maxDistance = farCam.distanceTo(controls.target);
    controls.update();
    camera.updateMatrixWorld(true);
    var camDist = camera.position.length();
    var screenRight = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    var screenUp = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    var screenForward = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 2).multiplyScalar(-1);
    function levelDir(v) {
      var n = v.clone().addScaledVector(screenUp, -v.dot(screenUp));
      if (n.lengthSq() < 1e-8) n.copy(screenRight);
      return n.normalize();
    }
    var side = levelDir(screenRight);
    var ahead = levelDir(camera.position.clone().negate());
    var sunAngle = orbit;
    var sunRadius = Math.max(camDist + 1.4, camDist * 1.65);
    var sunPos = new THREE.Vector3();
    sunPos.addScaledVector(side, -Math.cos(sunAngle));
    sunPos.addScaledVector(ahead, Math.sin(sunAngle));
    sunPos.multiplyScalar(sunRadius);
    sunBody.position.copy(sunPos);
    sunDir.copy(sunPos).normalize();
    var moonLen = moon.position.length() || 1.0;
    var phase = (moon.position.x * sunDir.x + moon.position.y * sunDir.y + moon.position.z * sunDir.z) / moonLen;
    moonMat.uniforms.fullAmt.value = (1.0 - phase) * 0.5;
    var toSun = sunPos.clone().sub(camera.position);
    var sunDist = toSun.length() || 1;
    var facing = toSun.dot(screenForward) / sunDist;
    var ray = toSun.clone().multiplyScalar(1 / sunDist);
    var tCenter = -camera.position.dot(ray);
    var miss = camera.position.clone().addScaledVector(ray, Math.max(0, tCenter)).length();
    var seen = Math.max(0, Math.min(1, (miss - 0.92) / 0.62));
    seen = seen * seen * (3 - 2 * seen);
    if (facing < 0.25) seen *= Math.max(0, facing / 0.25);
    if (sunGlow.shown == null) sunGlow.shown = seen;
    sunGlow.shown += (seen - sunGlow.shown) * 0.04;
    sunGlow.value = 1;
    sunBody.scale.setScalar(Math.max(0.45, sunDist / 9));
    sunBody.material.opacity = sunGlow.shown;
    sunBody.material.depthTest = true;
    sunBody.visible = facing > 0 && sunGlow.shown > 0.02;
    renderer.render(scene, camera);
  }

  canvas.style.touchAction = "none";
  var activePointers = {};
  var pointerCount = 0;
  canvas.addEventListener("pointerdown", function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    if (!activePointers[e.pointerId]) { activePointers[e.pointerId] = 1; pointerCount++; }

    dragX = e.clientX;

    if (e.pointerType !== "touch" && e.movementX) dx = e.movementX;
    orbit += dx * 0.01;
    dragX = e.clientX;

    else if (e.clientX >= window.innerWidth - margin) dragEdge = 1;

  canvas.addEventListener("touchstart", function (e) {
    if (e.touches.length >= 2) {
      dragging = false;
      dragEdge = 0;
      pinchDist = touchSpan(e.touches);
      e.preventDefault();

  canvas.addEventListener("touchmove", function (e) {
    if (e.touches.length >= 2) {

        if (zoomControl < 0) zoomControl = 0;
        if (zoomControl > 1) zoomControl = 1;

      dragEdge = 0;
      e.preventDefault();
    }

  canvas.addEventListener("touchcancel", function () { pinchDist = 0; });
  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    zoomControl -= e.deltaY * 0.0011;
    if (zoomControl < 0) zoomControl = 0;
    if (zoomControl > 1) zoomControl = 1;
  }, { passive: false });

  canvas.style.display = "block";
  document.body.classList.add("globe-on");
  document.getElementById("sky").style.background = "radial-gradient(circle at 50% 42%, #12182a 0%, #070910 62%, #05060c 100%)";
  globe = { frame: frame };
  (function loop() {
    frame(new Date());
    requestAnimationFrame(loop);
  })();
}
