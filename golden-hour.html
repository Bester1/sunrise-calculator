<link rel="canonical" href="https://sunrise.local/golden-hour.html">
<title>Golden hour</title>
<meta name="description" content="Morning and evening civil twilight for your city. The gold starts when the sun is 6 degrees below the horizon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, system-ui, sans-serif;
    color: #f4f1ea;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 18%, #3a2414 0%, #1a120c 42%, #070b16 100%);
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 28px 16px 40px;
  }
  .card {
    width: min(420px, 100%);
    background: rgba(10, 14, 26, .82);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 22px;
    padding: 18px 16px 16px;
    backdrop-filter: blur(16px);
  }
  .eyebrow {
    letter-spacing: .18em; text-transform: uppercase;
    font-size: 11px; color: rgba(255,255,255,.72);

    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.7);

    background: #162033; color: #fff;
    border: 1px solid rgba(255,255,255,.16); border-radius: 10px;

  .times { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pill {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 8px 10px;
  }
  .pill span {
    display: block; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: rgba(255,255,255,.7);
  }
  .pill b {
    display: block; margin-top: 2px;
    font-family: "Space Grotesk", sans-serif;

  }
  .window { margin-top: 10px; font-size: 13px; color: rgba(255,255,255,.82); }
  .note { margin-top: 12px; font-size: 12px; line-height: 1.45; color: rgba(255,255,255,.62); }
  .back { margin-top: 12px; font-size: 13px; }
  .back a, .note a { color: #ffd7a8; }

  details.fold > summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: rgba(255,255,255,.7); padding: 8px 0 2px;
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after {
    content: ""; flex: none; width: 7px; height: 7px;
    border-right: 2px solid #ffd7a8; border-bottom: 2px solid #ffd7a8;
    transform: rotate(45deg); margin-top: -3px;
  }
  details.fold[open] > summary::after { transform: rotate(-135deg); margin-top: 3px; }
  @media (min-width: 641px) {
    details.fold > summary { display: none; }
  }

  .card-min {
    display: none;
    border: 1px solid rgba(255,215,168,.45);
    background: transparent; color: #ffd7a8;
    border-radius: 999px; padding: 5px 10px;
    font: 600 11px Inter, system-ui, sans-serif;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .card-head, .card-titles { display: contents; }
  @media (max-width: 640px) {
    .wrap { padding: 0; align-items: stretch; }
    .card {
      width: 100%; min-height: 50vh; margin-top: auto;
      border-radius: 18px 18px 0 0;
    }
    .card.is-min { min-height: 0; }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .card-titles { display: block; }
    .card-min { display: inline-flex; flex: none; margin-top: 4px; }
    .card.is-min > :not(.card-head) { display: none; }
    h1 { font-size: 24px; }
    .pill b { font-size: 18px; }
  }

<body>
<main class="wrap">
  <section class="card">
    <div class="card-head">
      <div class="card-titles">
        <p class="eyebrow">Civil twilight</p>
        <h1>Golden hour</h1>
        <p class="city-name" id="city-name">Johannesburg</p>
      </div>
      <button class="card-min" type="button" aria-expanded="true">Hide</button>
    </div>
    <label>City
      <select id="city-picker" aria-label="City"></select>
    </label>
    <details class="fold" open>
      <summary>Today</summary>
      <div class="times">
        <div class="pill"><span>Morning starts</span><b id="dawn">--:--</b></div>
        <div class="pill"><span>Sunrise</span><b id="rise">--:--</b></div>
        <div class="pill"><span>Sunset</span><b id="set">--:--</b></div>
        <div class="pill"><span>Evening ends</span><b id="dusk">--:--</b></div>
      </div>
      <p class="window" id="windows"></p>
      <p class="note" id="note">Morning runs from civil dawn, when the sun is 6° below the horizon, up to sunrise. Evening runs from sunset down to civil dusk. No need for a globe here.</p>
    </details>
    <p class="back"><a id="back" href="index.html">Back to the globe</a></p>
  </section>
</main>
<script>
(function () {
  var btn = document.querySelector(".card-min");
  var card = document.querySelector(".card");
  if (!btn || !card) return;
  btn.addEventListener("click", function () {
    var slim = card.classList.toggle("is-min");
    btn.setAttribute("aria-expanded", slim ? "false" : "true");
    btn.textContent = slim ? "Show" : "Hide";
  });
})();
</script>

const RAD = Math.PI / 180;
const DEG = 180 / Math.PI;
let place = { name: "Johannesburg", lat: -26.2041, lng: 28.0473, tz: "Africa/Johannesburg", slug: "johannesburg" };

function pad(n) { return String(n).padStart(2, "0"); }
function dayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}
function sunUT(date, lat, lng, rising, zenith) {
  const n = dayOfYear(date);
  const lngHour = lng / 15;
  const t = n + ((rising ? 6 : 18) - lngHour) / 24;
  const M = (0.9856 * t) - 3.289;
  let L = M + (1.916 * Math.sin(M * RAD)) + (0.020 * Math.sin(2 * M * RAD)) + 282.634;
  L = (L % 360 + 360) % 360;
  let RA = DEG * Math.atan(0.91764 * Math.tan(L * RAD));
  RA = (RA % 360 + 360) % 360;
  const Lq = Math.floor(L / 90) * 90;
  const RAq = Math.floor(RA / 90) * 90;
  RA = (RA + (Lq - RAq)) / 15;
  const sinDec = 0.39782 * Math.sin(L * RAD);
  const cosDec = Math.cos(Math.asin(sinDec));
  const cosH = (Math.cos(zenith * RAD) - (sinDec * Math.sin(lat * RAD))) / (cosDec * Math.cos(lat * RAD));
  if (cosH > 1 || cosH < -1) return null;
  let H = rising ? 360 - DEG * Math.acos(cosH) : DEG * Math.acos(cosH);
  H /= 15;
  const T = H + RA - (0.06571 * t) - 6.622;
  let UT = (T - lngHour) % 24;
  if (UT < 0) UT += 24;
  return UT;
}
function localSun(date, lat, lng, rising, zenith) {
  const ut = sunUT(date, lat, lng, rising, zenith);
  if (ut == null) return null;
  const utc = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 0, 0, 0));
  return new Date(utc.getTime() + ut * 3600000);
}
function fmt(d) {
  if (!d) return "—";
  const opt = { hour: "2-digit", minute: "2-digit", hourCycle: "h23" };
  if (place.tz) opt.timeZone = place.tz;
  return new Intl.DateTimeFormat("en-GB", opt).format(d);
}
function minsBetween(a, b) {
  if (!a || !b) return null;
  let ms = b.getTime() - a.getTime();
  if (ms < 0) ms += 86400000;
  return Math.round(ms / 60000);
}
function windowText(label, minutes) {
  if (minutes == null) return label + " doesn’t happen today";
  return label + " lasts " + minutes + " min";
}
function show() {
  const now = new Date();
  const dawn = localSun(now, place.lat, place.lng, true, 96);
  const rise = localSun(now, place.lat, place.lng, true, 90.833);
  const set = localSun(now, place.lat, place.lng, false, 90.833);
  const dusk = localSun(now, place.lat, place.lng, false, 96);
  document.getElementById("city-name").textContent = place.name;
  document.getElementById("dawn").textContent = fmt(dawn);
  document.getElementById("rise").textContent = fmt(rise);
  document.getElementById("set").textContent = fmt(set);
  document.getElementById("dusk").textContent = fmt(dusk);
  document.getElementById("windows").textContent = windowText("Morning", minsBetween(dawn, rise)) + ". " + windowText("Evening", minsBetween(set, dusk)) + ".";
  document.title = "Golden hour in " + place.name;
  const back = document.getElementById("back");
  back.href = "sunrise-" + place.slug + ".html";
  back.textContent = "Sunrise in " + place.name;
  const sel = document.getElementById("city-picker");
  if (sel.value !== place.slug) sel.value = place.slug;
}
function selectCity(slug, push) {
  const row = CITY_PICK.find(function (r) { return r[1] === slug; });
  if (!row) return;
  place = { name: row[0], lat: row[2], lng: row[3], tz: row[4], slug: row[1] };
  if (push) {
    const url = "golden-hour.html?city=" + slug;
    try { history.replaceState({ slug: slug }, "", url); } catch (err) {}
  }
  show();
}

CITY_PICK.forEach(function (row) {
  const opt = document.createElement("option");
  opt.value = row[1];
  opt.textContent = row[0];
  sel.appendChild(opt);
});
sel.addEventListener("change", function () { selectCity(sel.value, true); });

selectCity(initial, false);
